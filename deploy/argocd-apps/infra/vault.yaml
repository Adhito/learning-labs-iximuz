# ArgoCD Application for the Vault Helm chart in this repo.
#
# NOT part of deploy/bootstrap/argocd/kustomization.yaml: the Application CRD has to
# exist before this can be applied, and that CRD ships with the ArgoCD install
# itself. Apply this after ArgoCD is up:
#
#   kubectl apply -f deploy/argocd-apps/infra/vault.yaml
#
# PREREQUISITE: the `vault-tls` Secret is NOT in git (see the chart README).
# Run gen-tls-secret.sh before the first sync, or Vault crash-loops on a
# missing cert file.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vault
  namespace: argocd
  finalizers:
    # Deleting the Application also deletes the workloads it created.
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  source:
    repoURL: https://github.com/Adhito/learning-labs-iximuz.git
    targetRevision: main
    path: helm-charts/vault
    helm:
      # MUST stay "vault". The chart's selectorLabels use .Release.Name, and a
      # StatefulSet selector is immutable -- changing this orphans the existing
      # StatefulSet and the sync fails.
      releaseName: vault
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    # Becomes .Release.Namespace during render.
    namespace: vault

  syncPolicy:
    automated:
      # prune: remove resources deleted from git.
      # Safe here: the vault-tls Secret and the PVC are not tracked by this
      # Application, so neither is a prune target.
      prune: true
      # selfHeal: revert manual kubectl edits back to git state.
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m

  ignoreDifferences:
    # Vault's `service_registration "kubernetes"` stanza patches its own pod
    # labels at runtime (vault-active, vault-sealed, vault-initialized).
    # Without this, Argo sees those live labels as drift and, with selfHeal on,
    # fights Vault over them forever.
    - group: apps
      kind: StatefulSet
      name: vault
      namespace: vault
      jsonPointers:
        - /spec/template/metadata/labels
