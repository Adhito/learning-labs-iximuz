# Headless service backing the StatefulSet: gives each pod a stable DNS name
# (vault-0.vault-internal.vault.svc.cluster.local) for Raft peering.
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: vault
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      protocol: TCP
    - name: https-internal
      port: 8201
      targetPort: 8201
      protocol: TCP
---
# In-cluster address for applications: http://vault.vault.svc.cluster.local:8200
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: vault
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      protocol: TCP
---
# External access: UI and API on <any-node-ip>:30004
apiVersion: v1
kind: Service
metadata:
  name: vault-nodeport
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: vault
spec:
  type: NodePort
  # publishNotReadyAddresses so you can reach the UI while Vault is still
  # uninitialized/sealed — otherwise you cannot get in to unseal it.
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
      nodePort: 30004
      protocol: TCP
