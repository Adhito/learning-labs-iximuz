apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/instance: vault
data:
  vault.hcl: |
    ui = true

    # No mlock in a container: the pod would need CAP_IPC_LOCK. Acceptable for a
    # lab; on real hardware prefer granting the capability over disabling this.
    disable_mlock = true

    listener "tcp" {
      address         = "0.0.0.0:8200"
      cluster_address = "0.0.0.0:8201"

      # Cert comes from the `vault-tls` Secret, created by gen-tls-secret.sh.
      # Vault will not start if these files are missing.
      tls_disable      = 0
      tls_cert_file    = "/vault/tls/tls.crt"
      tls_key_file     = "/vault/tls/tls.key"
      tls_min_version  = "tls12"
    }

    # Integrated storage (Raft). node_id comes from VAULT_RAFT_NODE_ID in the
    # StatefulSet, so it tracks the pod name.
    storage "raft" {
      path = "/vault/data"
    }

    service_registration "kubernetes" {}
