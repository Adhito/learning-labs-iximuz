{{/*
Headless service backing the StatefulSet: gives each pod a stable DNS name
for Raft peering.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.fullname" . }}-internal
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    {{- include "vault.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ include "vault.portName" . }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
    - name: https-internal
      port: {{ .Values.service.clusterPort }}
      targetPort: {{ .Values.service.clusterPort }}
      protocol: TCP
---
{{/*
In-cluster address for applications.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "vault.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ include "vault.portName" . }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
{{- if .Values.service.nodePort.enabled }}
---
{{/*
External access. publishNotReadyAddresses so the UI is reachable while Vault
is still uninitialized/sealed -- otherwise you cannot get in to unseal it.
*/}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "vault.fullname" . }}-nodeport
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "vault.labels" . | nindent 4 }}
spec:
  type: NodePort
  publishNotReadyAddresses: true
  selector:
    {{- include "vault.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ include "vault.portName" . }}
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      nodePort: {{ .Values.service.nodePort.port }}
      protocol: TCP
{{- end }}
